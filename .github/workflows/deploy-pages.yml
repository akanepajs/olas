name: deploy-pages

# Deploy the static site to GitHub Pages via Actions (bypasses the legacy Jekyll
# builder). Runs on human pushes to main and on manual dispatch. Daily automated
# updates deploy from within daily-scrape.yml (a GITHUB_TOKEN push does not
# trigger this workflow).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Retry: since ~24 Nov 2026 the uploaded artifact can take up to ~46 s
      # to become visible, and deploy-pages fails with "No artifacts named
      # github-pages" (actions/deploy-pages#451). Re-running the job does not
      # help (it then finds two artifacts), so wait and retry in the same job.
      - name: Wait for artifact listing
        run: sleep 10
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # Mirror index_en.html to eggs.kanepajs.eu; see daily-scrape.yml.
      - name: Mirror English page to eggs.kanepajs.eu
        env:
          GH_TOKEN: ${{ secrets.EGGS_DISPATCH_TOKEN }}
        run: gh workflow run sync-en.yml -R akanepajs/eggs -f ref="${{ github.sha }}"
